<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 - RACE RESULTS</title>
    <link rel="icon" type="image/png" href="../images/logo/f1-logo.png">
    <link rel="stylesheet" href="/styles/results.css">
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="logo"><img src="/images/logo/f1-logo.png" alt="F1 Logo">F1 - HOME OF MOTORSPORT</div>
        <nav class="navbar">
            <a href="../">HOME</a>
            <a href="results.html" class="active">RESULTS</a>
            <a href="standings.html">STANDINGS</a>            
            <a href="/html/drivers.html">DRIVERS</a>
            <a href="calendar.html">CALENDAR</a>
            <a href="techzone.html">TECH ZONE</a>
            <a href="archive.html">ARCHIVE</a>
        </nav>
    </header>

    <main class="results-page-container">
        <div class="data-box">
            <div class="results-header-container">
                <h3>GRAND PRIX RESULTS</h3>
                <select id="round-select">
                    <option value="">Select Round...</option>
                </select>
            </div>
            
            <table class="data-table">
                <thead>
                    <tr>
                        <th>POS</th>
                        <th>DRIVER</th>
                        <th>CAR</th>
                        <th>LAPS</th>
                        <th>TIME / GAP</th>
                        <th class="points">PTS</th>
                    </tr>
                </thead>
                <tbody id="race-results-body">
                    <tr><td colspan="6" style="text-align: center; color: #666;">Please select a race round above.</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 F1 - HOME OF MOTORSPORT</p>
    </footer>

    <script src="/script/results.js"></script>
</body>
</html>
